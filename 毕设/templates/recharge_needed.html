<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>余额不足 | 运动宝</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #eef2f9 0%, #e0e8f0 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: -20%;
            right: -10%;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(66, 153, 225, 0.12) 0%, rgba(66, 153, 225, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -15%;
            left: -8%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(72, 187, 120, 0.08) 0%, rgba(72, 187, 120, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .card {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 2rem;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.15);
            position: relative;
            z-index: 2;
        }

        .icon {
            font-size: 4rem;
            color: #e53e3e;
            margin-bottom: 1rem;
        }

        h3 {
            font-weight: 700;
            color: #1e2f3e;
            margin-bottom: 0.5rem;
        }

        .amount {
            font-size: 2rem;
            font-weight: 800;
            color: #2c5282;
            margin: 1rem 0;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: linear-gradient(115deg, #2f855a, #276749);
            border: none;
            border-radius: 2rem;
            padding: 0.8rem 1.5rem;
            font-weight: 600;
            color: white;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            background: linear-gradient(115deg, #38a169, #2f855a);
        }

        .btn-secondary {
            background-color: #64748b;
            border: none;
            border-radius: 2rem;
            padding: 0.8rem 1.5rem;
            font-weight: 600;
            color: white;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-secondary:hover {
            background-color: #475569;
            transform: translateY(-2px);
        }

        .footer-note {
            margin-top: 1.5rem;
            font-size: 0.7rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">
        <i class="fas fa-exclamation-triangle"></i>
    </div>
    <h3>余额不足</h3>
    <p class="text-muted">您的账户余额不足以支付本次订单</p>
    <div class="amount">需要 ¥{{ required }}</div>
    <div class="btn-group">
        <a href="/recharge" class="btn-primary">
            <i class="fas fa-wallet"></i> 去充值
        </a>
        <a href="/insurance/products" class="btn-secondary">
            <i class="fas fa-arrow-left"></i> 返回产品列表
        </a>
    </div>
    <div class="footer-note">
        <i class="fas fa-shield-alt"></i> 充值后请在购物车中重新发起支付
    </div>
</div>
</body>
</html>

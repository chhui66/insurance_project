<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 运动宝</title>
    <!-- Bootstrap 5 CSS (仅用于栅格和基础样式) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 字体 Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f0f4fa 0%, #e2eaf1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        /* 主容器：左右两栏 */
        .register-wrapper {
            max-width: 1200px;
            width: 100%;
            background: #ffffff;
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            display: flex;
            flex-wrap: wrap;
        }
        /* 左侧品牌区 */
        .brand-area {
            flex: 1;
            background: linear-gradient(135deg, #2f855a, #1e5a3e);
            padding: 3rem 2.5rem;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .brand-area::before {
            content: '';
            position: absolute;
            top: -20%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .brand-logo {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-logo i {
            font-size: 2.2rem;
        }
        .brand-title {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1rem;
        }
        .brand-desc {
            font-size: 1rem;
            opacity: 0.85;
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        .feature-list {
            list-style: none;
            padding: 0;
            margin-top: 1rem;
        }
        .feature-list li {
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .feature-list li i {
            font-size: 1.2rem;
            width: 28px;
            text-align: center;
        }
        /* 右侧表单区 */
        .form-area {
            flex: 1;
            padding: 3rem 2.5rem;
            background: white;
        }
        .form-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .form-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1e2f3e;
        }
        .form-header p {
            color: #6c757d;
            margin-top: 0.5rem;
        }
        .form-label {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-control {
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: #48bb78;
            box-shadow: 0 0 0 3px rgba(72, 187, 120, 0.2);
            outline: none;
        }
        .btn-register {
            background: linear-gradient(135deg, #38a169, #2f855a);
            border: none;
            border-radius: 2rem;
            padding: 0.75rem;
            font-weight: 600;
            width: 100%;
            transition: all 0.2s;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }
        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            border-top: 1px solid #edf2f7;
            padding-top: 1.5rem;
        }
        .login-link a {
            color: #38a169;
            text-decoration: none;
            font-weight: 500;
        }
        /* 响应式：小屏幕时改为上下布局 */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            .register-wrapper {
                flex-direction: column;
            }
            .brand-area {
                padding: 2rem 1.5rem;
                text-align: center;
            }
            .brand-logo {
                justify-content: center;
            }
            .feature-list {
                text-align: left;
                max-width: 280px;
                margin: 0 auto;
            }
            .form-area {
                padding: 2rem 1.5rem;
            }
            .brand-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
<div class="register-wrapper">
    <!-- 左侧品牌区 -->
    <div class="brand-area">
        <div class="brand-logo">
            <i class="fas fa-shield-alt"></i>
            <span>运动宝</span>
        </div>
        <div class="brand-title">
            开启健康保障<br>从注册开始
        </div>
        <div class="brand-desc">
            加入我们，享受个性化运动风险评估、智能保险推荐与便捷理赔服务，让每一次运动都安心无忧。
        </div>
        <ul class="feature-list">
            <li><i class="fas fa-chart-line"></i> 运动数据追踪与分析</li>
            <li><i class="fas fa-calculator"></i> BMI / 体脂 / BMR 精准评估</li>
            <li><i class="fas fa-shield-alt"></i> 智能保险方案推荐</li>
            <li><i class="fas fa-headset"></i> 7×24小时 AI 客服支持</li>
        </ul>
    </div>

    <!-- 右侧表单区 -->
    <div class="form-area">
        <div class="form-header">
            <h2>创建新账户</h2>
            <p>填写信息，立即加入运动保障计划</p>
        </div>
        <form method="post">
            <div class="mb-4">
                <label for="username" class="form-label">
                    <i class="fas fa-user"></i> 用户名
                </label>
                <input type="text" class="form-control" id="username" name="username" placeholder="请设置用户名" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">
                    <i class="fas fa-lock"></i> 密码
                </label>
                <input type="password" class="form-control" id="password" name="password" placeholder="请设置密码（至少6位）" required>
            </div>
            <button type="submit" class="btn btn-register">
                <i class="fas fa-user-plus"></i> 注册新账号
            </button>
        </form>

        <div class="login-link">
            已有账号？<a href="/login">立即登录</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/sw.js')
            .then(reg => console.log('Service Worker 注册成功', reg))
            .catch(err => console.log('Service Worker 注册失败', err));
    }
</script>
</body>
</html>

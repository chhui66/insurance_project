<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客服对话管理 | 后台</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: #f5f5f5;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        .navbar {
            background: #2c5282;
        }
        .container {
            max-width: 1000px;
            margin: 20px auto;
        }
        .user-list {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .user-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #e9ecef;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            color: #333;
        }
        .user-item:hover {
            background: #f8f9fa;
        }
        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #2c5282;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            margin-right: 16px;
            flex-shrink: 0;
        }
        .user-info {
            flex: 1;
        }
        .user-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 4px;
        }
        .last-msg {
            font-size: 0.85rem;
            color: #6c757d;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 300px;
        }
        .last-time {
            font-size: 0.75rem;
            color: #999;
            margin-left: 16px;
            white-space: nowrap;
        }
        .empty-message {
            text-align: center;
            padding: 60px;
            color: #999;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand">客服对话管理</span>
            <div class="navbar-nav ms-auto">
                <a href="/admin/dashboard" class="nav-link">仪表盘</a>
                <a href="/admin/logout" class="nav-link text-danger">退出</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-3">用户列表</h2>
        {% if user_list %}
        <div class="user-list">
            {% for user in user_list %}
            <a href="/admin/message/chat/{{ user.user_id }}" class="user-item">
                <div class="user-avatar">{{ user.username[0]|upper }}</div>
                <div class="user-info">
                    <div class="user-name">{{ user.username }}</div>
                    <div class="last-msg">{{ user.last_msg|truncate(50) }}</div>
                </div>
                <div class="last-time">{{ user.last_time.strftime('%Y-%m-%d %H:%M') }}</div>
            </a>
            {% endfor %}
        </div>
        {% else %}
        <div class="empty-message">
            <i class="fas fa-comments fa-3x mb-2"></i>
            <p>暂无用户咨询消息</p>
        </div>
        {% endif %}
        <div class="mt-3">
            <a href="/admin/dashboard" class="btn btn-secondary">返回仪表盘</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
